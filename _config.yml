title: Intelligent Robotics
name: Intelligent Robotics Lab
description: Research lab in robotics and AI

url: https://briandeegan82.github.io
baseurl: /intelligent_robotics.github.io

remote_theme: academicpages/academicpages.github.io

# Privacy-friendly analytics via GoatCounter (https://www.goatcounter.com/).
# Dashboard: https://intelligentrobotics.goatcounter.com
# Analytics load only when JEKYLL_ENV=production (GitHub Pages does this by default).
analytics:
  provider: "custom"
goatcounter: "intelligentrobotics"

plugins:
  - jekyll-include-cache
  - jekyll-redirect-from

include:
  - _pages
  - _images

collections:
  pages:
    output: true
    permalink: /:path/

header_pages:
  - _pages/projects.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
