title: Free University Robotics Curriculum
intro: A structured directory of university robotics courses with freely accessible material. Where a
  university publishes lectures, notes, assignments, or projects openly, it is included. Where a course
  is only listed in a catalogue without verified free materials, it is flagged rather than presented as
  free.
caveat: Excellent robotics programmes at Oxford, Cornell, TUM, MSU and elsewhere are worth watching for
  research, but a strong university course does not automatically mean the materials are public MOOCs.
  This directory emphasises MIT, Stanford, Michigan, ETH and NPTEL, where public educational material
  could be verified.
legend:
- key: open
  label: Free/open
  description: Substantial course material publicly accessible
- key: partial
  label: Free material
  description: Lectures/resources available, but less complete or not a self-contained course
- key: mooc
  label: MOOC/audit
  description: Generally free to study, optional paid certificate
- key: reference
  label: Reference only
  description: University course exists, but a free public version was not verified
