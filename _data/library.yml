sections:
  - slug: papers
    title: "Paper Spotlights"
    description: "Research summaries and takeaways from papers worth reading in manipulation, SLAM, and vision."
    order: 1
  - slug: tools
    title: "Tools & Software"
    description: "Open-source stacks, repos, and models you can use in robotics projects."
    order: 2
  - slug: courses
    title: "Free University Courses"
    description: "Structured free/open university robotics curriculum — Michigan, MIT, Stanford, ETH, NPTEL and more."
    order: 3
  - slug: references
    title: "References & Curated Lists"
    description: "Evergreen explainers, documentation links, and curated directories."
    order: 4
  - slug: conferences
    title: "Conferences"
    description: "Flagship robotics research and developer venues, plus the IEEE RAS conferences overview."
    order: 5

conferences:
  - title: "Conference on Robot Learning"
    short_name: "CoRL"
    focus: "Robot learning"
    description: "Annual international conference at the intersection of robotics and machine learning."
    url: "https://www.corl.org/home"
  - title: "ROSCon Global"
    short_name: "ROSCon"
    focus: "ROS developers"
    description: "Developer conference for the ROS community — talks, workshops, tutorials, and demos."
    url: "https://roscon.ros.org/2026/"
  - title: "IEEE Robotics and Automation Society — Conferences & Workshops"
    short_name: "IEEE RAS"
    focus: "Conference hub"
    description: "Overview of IEEE RAS fully sponsored, financially co-sponsored, and technically co-sponsored conferences."
    url: "https://www.ieee-ras.org/conferences-workshops/"
  - title: "IEEE International Conference on Robotics and Automation"
    short_name: "ICRA"
    focus: "General robotics"
    description: "Flagship IEEE RAS conference covering the full breadth of robotics and automation research."
    url: "https://www.ieee-ras.org/conferences-workshops/fully-sponsored/icra/"
  - title: "IEEE/RSJ International Conference on Intelligent Robots and Systems"
    short_name: "IROS"
    focus: "Intelligent robots"
    description: "Major international conference on intelligent robots, perception, planning, and systems."
    url: "https://www.ieee-ras.org/conferences-workshops/financially-co-sponsored/iros/"
  - title: "IEEE International Conference on Automation Science and Engineering"
    short_name: "CASE"
    focus: "Automation"
    description: "IEEE RAS conference on automation science, manufacturing systems, and industrial robotics."
    url: "https://www.ieee-ras.org/conferences-workshops/fully-sponsored/case/"
  - title: "ACM/IEEE International Conference on Human-Robot Interaction"
    short_name: "HRI"
    focus: "Human–robot interaction"
    description: "Premier venue for research on how people and robots work together."
    url: "https://humanrobotinteraction.org/"
  - title: "CISM–IFToMM Symposium on Robot Design, Dynamics and Control"
    short_name: "RoManSy"
    focus: "Design & dynamics"
    description: "Long-running symposium on robot design, dynamics, and control."
    url: "https://www.ieee-ras.org/conferences-workshops/"
  - title: "IEEE Conference on Decision and Control"
    short_name: "CDC"
    focus: "Control theory"
    description: "Flagship IEEE Control Systems Society conference on decision and control — highly relevant for robotics control research."
    url: "https://ieeecss.org/conferences/cdc"
  - title: "IEEE International Conference on Rehabilitation Robotics"
    short_name: "ICORR"
    focus: "Rehab robotics"
    description: "IEEE conference on rehabilitation robotics, assistive devices, and related clinical applications."
    url: "https://www.ieee-ras.org/conferences-workshops/"
  - title: "IEEE-RAS International Conference on Humanoid Robots"
    short_name: "Humanoids"
    focus: "Humanoids"
    description: "Dedicated IEEE RAS conference on humanoid robotics platforms, control, and applications."
    url: "https://www.ieee-ras.org/conferences-workshops/fully-sponsored/humanoids"
  - title: "International Symposium on Robotics Research"
    short_name: "ISRR"
    focus: "Foundational research"
    description: "Selective symposium covering foundational and emerging topics in robotics research."
    url: "https://www.isrr-robotics.org/"
  - title: "International Symposium on Experimental Robotics"
    short_name: "ISER"
    focus: "Experimental robotics"
    description: "Symposium emphasizing experimentally validated robotics research and systems."
    url: "https://www.experimentalrobotics.org/"
  - title: "ROBOTICA / IEEE International Conference on Autonomous Robot Systems and Competitions"
    short_name: "Robotica / ICARSC"
    focus: "Competitions & autonomy"
    description: "Portuguese Robotics Open (ROBOTICA) co-located with ICARSC — autonomous systems, competitions, and education."
    url: "https://icarsc.pt/"
  - title: "Robotics: Science and Systems"
    short_name: "RSS"
    focus: "Selective single-track"
    description: "Highly selective single-track conference for robotics science and systems research."
    url: "https://roboticsconference.org/"
  - title: "International Workshop on the Algorithmic Foundations of Robotics"
    short_name: "WAFR"
    focus: "Algorithms"
    description: "Premier venue for algorithmic and mathematical foundations of robotics."
    url: "http://algorithmic-robotics.org/"

