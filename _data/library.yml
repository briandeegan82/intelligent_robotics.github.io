    track: ros
    section: references
    url: "https://cse.sc.edu/~jokane/agitr/agitr-letter.pdf"
  - title: "Introduction to Autonomous Robots (Correll et al.)"
    description: "Open textbook covering kinematics, control, sensing, and robot programming fundamentals."
